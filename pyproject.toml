[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly. Ruff's defaults change between releases, so an unpinned
# rule set means the same commit can pass on one machine and fail on another —
# which would make every evidence record unreproducible.
select = ["E", "F", "W", "I", "UP", "B", "PL", "RUF"]
ignore = ["PLR2004"]  # magic-value comparisons; too noisy for parsing code

[tool.ruff.lint.isort]
# Without this, ruff groups `edad` as third-party and demands a frozen test's
# imports be reordered — a lint error in a file no ticket may edit, which makes
# full_gate unwinnable. Telling the linter which package is ours is the fix,
# not editing a hash-locked file.
known-first-party = ["edad"]
